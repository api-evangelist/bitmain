apis:
- aid: bitmain:antpool-api
  name: Antpool API
  description: >-
    Public HTTP API for Antpool, Bitmain's Bitcoin mining pool. Account operators
    can read account balance, account and worker hashrate, worker lists, payment
    history, and pool statistics. All private interfaces are POST, form-encoded,
    and signed with an HMAC-SHA256 signature (userId + apiKey + nonce, keyed by
    the operator's API secret). Rate-limited to 600 requests per 10 minutes per IP.
