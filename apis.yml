name: Bitmain
description: >-
  Bitmain Technologies is a Beijing-based designer and manufacturer of ASIC
  cryptocurrency-mining hardware, best known for its Antminer line of Bitcoin
  (SHA-256) and other proof-of-work miners. Bitmain also operates Antpool, one of
  the world's largest Bitcoin mining pools, which exposes a public HTTP API that
  lets account operators programmatically read account balances, account and
  worker hashrate, worker lists, payment history, and pool-wide statistics. The
  Antpool API authenticates each request with an HMAC-SHA256 signature computed
  from the operator's user id, API key, and an incrementing nonce, and
  rate-limits clients to 600 requests per 10 minutes per IP. This company was
  surfaced as a portfolio company of Hongshan and enriched by the API Evangelist
  pipeline.
